name: "My first workflow"
on: 
  workflow_dispatch:  

jobs:
  job1:
    name: "Job1"
    runs-on: ubuntu-latest
    steps:
      - name: Running single command
        run: echo "First git actions workflow"
      - name: Checking OS release of runner
        run: cat /etc/os-release
      - name: Calling sleep
        run: sleep 20
  job2:
    name: "Second job"
    runs-on: ubuntu-latest
    steps:
      - name: Checking the host name of the runner
        run: hostname
      - name: Running multiple commands
        run: |
          echo "This is the first of the multi step process"
          echo "This is the final step"
          sleep 20
  job3:
    name: "Checking job dependency"
    needs: job2
    runs-on: ubuntu-latest
    steps:
      - name: Job with single dependency
        run: sleep 10
  job4:
    name: "Checking job dependency - multiple"
    needs: [job1, job2, job3]
    runs-on: ubuntu-latest
    steps:
      - name: Job with multiple dependency
        run: sleep 10        
