name: "My Second Workflow Example"
on:
  push:
  workflow_dispatch: 

jobs:
  testing_commands_checkout_code:
    runs-on: ubuntu-latest
    steps:
      - name: Run some commands
        run: |
          pwd
          ls -ltr
          hostname
      - name: Checkout code
        uses: actions/checkout@v6.1.0  
      - name: Post checkout verification
        run: |
          mkdir artifacts
          echo 'pwd' >> my-artifact.txt
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: Upload a single artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single_artifact
          path: ./my-artifact.txt
      - name: Upload a single artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory_upload
          path: artifacts/
      - name: Upload multiple artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_artifact
          path: |
            ./my-artifact.txt
            artifacts/
      - name: Upload multiple artifacts with exclusions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multi_artifacts_with_exclusions
          path: |
            ./my-artifact.txt
            artifacts/
            !**/hostname.txt

  testing_download_feature:
    needs: testing_commands_checkout_code
    runs-on: ubuntu-latest
    steps:
      - name: Check directory before download
        run: |
          pwd
          ls -ltr
      - name: Download the file
        uses: actions/download-artifact@v8.0.2
        with:
          name: single_artifact
      - name: Check after artifactory download
        run: |
          pwd
          ls -ltr
  testing_download_feature_directory:
    needs: testing_commands_checkout_code
    runs-on: ubuntu-latest
    steps:
      - name: Check directory before download
        run: |
          pwd
          ls -ltr
      - name: Download the directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: directory_upload
      - name: Check after directory download
        run: |
          pwd
          ls -ltr             
    
  
        
          
      
